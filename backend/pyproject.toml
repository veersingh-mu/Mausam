[project]
name = "mausam-backend"
version = "1.0.0"
description = "Mausam Backend Services & API Gateway"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "redis>=5.0.3",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.3"
]

[tool.vercel]
entrypoint = "api_gateway.app.main:app"

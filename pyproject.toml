[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mausam"
version = "1.0.0"
description = "Mausam - Hyper-local Persona-Driven Weather Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "greenlet>=3.0.3",
    "redis>=5.0.3",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.3",
    "uvicorn>=0.29.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "api*"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.json", "*.png", "*.jpg", "*.svg"]

[tool.vercel]
entrypoint = "api.index:app"

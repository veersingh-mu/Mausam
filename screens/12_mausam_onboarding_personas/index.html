<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom toggle animation for tiles */
        .tile-checkbox:checked + div {
            border-color: #1a237e; /* primary-container */
            background-color: #f1f1f1; /* inverse-on-surface */
            box-shadow: 0 4px 12px rgba(26, 35, 126, 0.15);
        }
        
        .tile-checkbox:checked + div .tile-icon,
        .tile-checkbox:checked + div .tile-label {
            color: #000666; /* primary */
        }
        
        .tile-checkbox:checked + div .check-indicator {
            opacity: 1;
            transform: scale(1);
        }
        
        .check-indicator {
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s ease-in-out;
        }
        
        /* Hide scrollbar for clean look */
        ::-webkit-scrollbar {
            display: none;
        }

            -ms-overflow-style: none;
